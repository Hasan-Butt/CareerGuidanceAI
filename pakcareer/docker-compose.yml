version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: pakcareer-db
    restart: always
    environment:
      POSTGRES_USER: pakcareer
      POSTGRES_PASSWORD: pakcareer_secret_password
      POSTGRES_DB: pakcareer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakcareer -d pakcareer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pakcareer-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pakcareer:pakcareer_secret_password@db:5432/pakcareer
      PORT: 8000
    volumes:
      - ../models:/models:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pakcareer-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:

