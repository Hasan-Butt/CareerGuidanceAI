version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: pakcareer-db
    restart: always
    environment:
      POSTGRES_USER: pakcareer
      # Set POSTGRES_PASSWORD in a .env file next to this compose file (never commit it)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pakcareer
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the backend container needs the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakcareer -d pakcareer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pakcareer-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pakcareer:${POSTGRES_PASSWORD}@db:5432/pakcareer
      PORT: 8000
      MODEL_DIR: /models/weights
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_KEY: ${ADMIN_KEY:-}
    volumes:
      - ../models:/models:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pakcareer-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:

